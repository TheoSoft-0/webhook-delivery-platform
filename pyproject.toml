[project]
name = "webhook-delivery-platform"
version = "0.1.0"
description = "A reliable, locally deployable webhook delivery platform."
readme = "README.md"
authors = [
    { name = "TheoSoft-0" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20,<2",
    "cryptography>=50,<51",
    "fastapi>=0.162.4",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.1,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
webhook-delivery-platform = "webhook_delivery_platform:main"
webhook-delivery-platform-admin = "webhook_delivery_platform.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
