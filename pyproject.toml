[project]
name = "webhook-delivery-platform"
version = "0.1.0"
description = "A reliable, locally deployable webhook delivery platform."
readme = "README.md"
authors = [
    { name = "TheoSoft-0" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings[dotenv]>=2,<3",
    "sqlalchemy>=2.1,<3",
]

[project.scripts]
webhook-delivery-platform = "webhook_delivery_platform:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
